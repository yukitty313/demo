function saveToFirebase(){

function startListening(){
  if(dbUnsubscribe) dbUnsubscribe();
  const r = ref(db, DATA_REF);
  dbUnsubscribe = onValue(r, snap => {
    if(snap.exists()){
      const remote = snap.val();
      if(remote.shifts) remote.shifts = Object.values(remote.shifts);
      if(remote.wages)  remote.wages  = Object.values(remote.wages);
      Object.assign(S, remote);
    }
    renderDash();
    if(document.getElementById('tab-cal').style.display !== 'none') renderCal();
    if(document.getElementById('tab-wage').style.display !== 'none') renderWageList();
    showSyncStatus('同期済み');
  }, e => {
    showSyncStatus('同期エラー', true);
  });
}

/* ===== HELPERS ===== */
function pd(s){ if(!s)return null; const m=s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function pt(s){ if(!s)return null; const m=s.match(/(\d{1,2}):(\d{2})/); return m?+m[1]*60+ +m[2]:null; }
function fm(n){ return '¥'+Math.round(n).toLocaleString('ja-JP')+'円'; }
function fms(n){ return '¥'+Math.round(n).toLocaleString('ja-JP'); }
function dateKey(y,mo,d){ return `${y}/${String(mo+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function uid(){ return Math.random().toString(36).slice(2,9); }

function wageFor(ds){
  const dt=pd(ds); if(!dt) return 1000;
  let best=null;
  for(const w of S.wages){
    const ws=pd(w.start), we=w.end?pd(w.end):new Date(2099,11,31);
    if(ws&&we&&dt>=ws&&dt<=we){ if(!best||pd(w.start)>=pd(best.start)) best=w; }
  }
  return best?best.rate:1000;
}
function calcShift(sh){
  const st=pt(sh.start),et=pt(sh.end); if(st===null||et===null) return 0;
  let m=et-st; if(m<0)m+=1440; m-=(sh.breakMin||0);
  return Math.max(0,m/60)*wageFor(sh.date);
}
function calcHours(sh){
  const st=pt(sh.start),et=pt(sh.end); if(st===null||et===null) return 0;
  let m=et-st; if(m<0)m+=1440; m-=(sh.breakMin||0); return Math.max(0,m/60);
}
function monthlyData(){
  const amt=Array(12).fill(0), hrs=Array(12).fill(0);
  for(const s of S.shifts){
    const dt=pd(s.date); if(!dt||dt.getFullYear()!==S.year) continue;
    const mo=dt.getMonth(); amt[mo]+=calcShift(s); hrs[mo]+=calcHours(s);
  }
  return{amt,hrs};
}
function shiftsOn(key){ return S.shifts.filter(s=>s.date===key); }

/* ===== DASHBOARD ===== */
window.renderDash = function(){
  if(!document.getElementById('m-total')) return;
  const{amt,hrs}=monthlyData();
  const total=amt.reduce((a,b)=>a+b,0);
  const remain=Math.max(0,S.limit-total);
  const now=new Date(), curMo=now.getMonth();
  const remMos=now.getFullYear()===S.year?Math.max(1,12-curMo):12;
  const avg=remain/remMos;
  const pct=Math.min(100,total/S.limit*100);
  const cls=pct<70?'ok':pct<90?'warn':'danger';

  document.getElementById('m-total').textContent=fm(total);
  document.getElementById('m-total').className='metric-value '+cls;
  document.getElementById('m-remain').textContent=fm(remain);
  document.getElementById('m-avg').textContent=fm(avg);
  document.getElementById('m-cur').textContent=fm(amt[curMo]||0);
  document.getElementById('pct-label').textContent=Math.round(pct)+'%';
  const pf=document.getElementById('pfill');
  pf.style.width=pct+'%'; pf.className='pfill '+cls;
  document.getElementById('limit-label').textContent='上限 '+fms(S.limit);
  document.getElementById('yearBadge').textContent=S.year+'年';

  const aa=document.getElementById('alertArea');
  if(pct>=90) aa.innerHTML=`<div class="alert danger">⚠️ 年収上限の${Math.round(pct)}%に達しています。残り${fm(remain)}です。</div>`;
  else if(pct>=70) aa.innerHTML=`<div class="alert warn">📊 上限の${Math.round(pct)}%に到達。残り${fm(remain)}（月平均${fm(avg)}）</div>`;
  else if(total>0) aa.innerHTML=`<div class="alert ok">✅ 順調です。残り${fm(remain)}、月平均${fm(avg)}まで働けます。</div>`;
  else aa.innerHTML='';

  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const maxAmt=Math.max(...amt,1);
  document.getElementById('monthRow').innerHTML=mn.map((n,i)=>{
    const isCur=i===curMo&&now.getFullYear()===S.year;
    const hasData=amt[i]>0;
    const pct=Math.round(amt[i]/maxAmt*100);
    const dispPct=hasData?pct+'%':'—';
    return `<div class="month-card ${isCur?'cur':''} ${hasData?'has-data':''}" onclick="jumpMonth(${i})">
      <div class="mc-bg" style="width:${pct}%"></div>
      <div class="mname">${n}</div>
      <div class="mc-mid">
        <div class="mamt ${hasData?'':'zero'}">${fms(amt[i])}</div>
        <div class="mhrs">${hrs[i].toFixed(1)}h</div>
      </div>
      <div class="mc-bar-wrap">
        <div class="mc-bar-bg"><div class="mc-bar-fill" style="width:${pct}%"></div></div>
        <div class="mc-pct">${dispPct}</div>
      </div>
    </div>`;
  }).join('');
};


/* ===== CALENDAR ===== */
window.renderCal = function(){
  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent=calYear+'年'+mn[calMonth];
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  const cellCount=Math.ceil((first+days)/7)*7;
  let html='';
  for(let i=0;i<cellCount;i++){
    let d,mo,yr,other=false;
    if(i<first){d=prevDays-first+i+1;mo=calMonth-1;yr=calYear;if(mo<0){mo=11;yr--;}other=true;}
    else if(i>=first+days){d=i-first-days+1;mo=calMonth+1;yr=calYear;if(mo>11){mo=0;yr++;}other=true;}
    else{d=i-first+1;mo=calMonth;yr=calYear;}
    const dow=i%7;
    const key=dateKey(yr,mo,d);
    const ss=other?[]:shiftsOn(key);
    const isToday=yr===today.getFullYear()&&mo===today.getMonth()&&d===today.getDate();
    let cls='cal-cell';
    if(dow===0)cls+=' sun'; if(dow===6)cls+=' sat';
    if(other)cls+=' other'; if(isToday)cls+=' today'; if(ss.length)cls+=' has-shift';
    let inner=`<span class="day-num">${d}</span>`;
    for(const s of ss) inner+=`<span class="shift-badge">${s.start}-${s.end}</span>`;
    if(ss.length) inner+=`<span class="shift-amt">${fms(ss.reduce((a,s2)=>a+calcShift(s2),0))}</span>`;
    const ca=other?'':`onclick="openModal('${key}')"`;
    html+=`<div class="${cls}" ${ca}>${inner}</div>`;
  }
  document.getElementById('calBody').innerHTML=html;
  const mShifts=S.shifts.filter(s=>{const dt=pd(s.date);return dt&&dt.getFullYear()===calYear&&dt.getMonth()===calMonth;});
  const mTotal=mShifts.reduce((a,s)=>a+calcShift(s),0);
  const mHrs=mShifts.reduce((a,s)=>a+calcHours(s),0);
  document.getElementById('calSummary').textContent=mn[calMonth]+'合計：'+fm(mTotal)+'（'+mHrs.toFixed(1)+'時間 / '+mShifts.length+'日）';
};

window.calPrev=function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); };
window.calNext=function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); };
window.jumpMonth=function(m){ calYear=S.year; calMonth=m; showTab('cal'); };

/* ===== iOS PICKER ===== */
const ITEM_H=44;
const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const MINS=['00','15','30','45'];
const pickerState={};

function buildPicker(listId,colId,items,initVal){
  const listEl=document.getElementById(listId);
  const colEl=document.getElementById(colId);
  if(!listEl||!colEl) return;
  listEl.innerHTML='';
  const n=items.length;
  for(let c=0;c<3;c++) items.forEach(v=>{
    const div=document.createElement('div');
    div.className='drum-list-item';
    div.textContent=v;
    listEl.appendChild(div);
  });
  let initIdx=items.indexOf(initVal); if(initIdx<0)initIdx=0;
  function idxToY(idx){ return -((n+idx)*ITEM_H)+2*ITEM_H; }
  function yToIdx(y){ return ((Math.round((-y+2*ITEM_H)/ITEM_H)-n)%n+n)%n; }
  let posY=idxToY(initIdx), velY=0, rafId=null, isDragging=false;
  function updateDOM(){
    listEl.style.transform=`translateY(${posY}px)`;
    const ci=yToIdx(posY);
    listEl.querySelectorAll('.drum-list-item').forEach((el,k)=>{
      const sel=(k%n)===ci;
      el.style.color=sel?'#1c2a5e':'#8496c8';
      el.style.fontSize=sel?'22px':'15px';
      el.style.fontWeight=sel?'700':'400';
    });
  }
  function snapNearest(){ return idxToY(yToIdx(posY)); }
  function physicsLoop(){
    if(isDragging){rafId=requestAnimationFrame(physicsLoop);return;}
    const target=snapNearest(), dist=target-posY;
    velY=velY*0.78+dist*0.18;
    if(Math.abs(velY)<0.15&&Math.abs(dist)<0.2){
      posY=target;velY=0;updateDOM();rafId=null;return;
    }
    posY+=velY;updateDOM();
    rafId=requestAnimationFrame(physicsLoop);
  }
  function startLoop(){ if(!rafId) rafId=requestAnimationFrame(physicsLoop); }
  listEl.style.transition='none';
  updateDOM();
  let dragStartY=0,dragStartPos=0,samples=[];
  function pointerStart(clientY){
    isDragging=true;dragStartY=clientY;dragStartPos=posY;
    samples=[{y:clientY,t:performance.now()}];velY=0;
    if(!rafId) rafId=requestAnimationFrame(physicsLoop);
  }
  function pointerMove(clientY){
    if(!isDragging) return;
    posY=dragStartPos+(clientY-dragStartY);
    const minY=idxToY(n-1)-ITEM_H*2, maxY=idxToY(0)+ITEM_H*2;
    if(posY<minY)posY=minY; if(posY>maxY)posY=maxY;
    const now=performance.now();
    samples.push({y:clientY,t:now});
    samples=samples.filter(s=>now-s.t<80);
    updateDOM();
  }
  function pointerEnd(){
    if(!isDragging) return;
    isDragging=false;
    if(samples.length>=2){
      const first=samples[0],last=samples[samples.length-1],dt=last.t-first.t;
      if(dt>0) velY=(last.y-first.y)/dt*16;
    } else velY=0;
    startLoop();
  }
  colEl.addEventListener('mousedown',e=>{pointerStart(e.clientY);e.preventDefault();});
  colEl._pickerMove=e=>{if(isDragging)pointerMove(e.clientY);};
  colEl._pickerUp=()=>{if(isDragging)pointerEnd();};
  colEl.addEventListener('touchstart',e=>{pointerStart(e.touches[0].clientY);},{passive:true});
  colEl.addEventListener('touchmove',e=>{pointerMove(e.touches[0].clientY);e.preventDefault();},{passive:false});
  colEl.addEventListener('touchend',()=>{pointerEnd();});
  colEl.addEventListener('wheel',e=>{
    e.preventDefault();velY+=e.deltaY>0?-60:60;startLoop();
  },{passive:false});
  pickerState[listId]={getValue:()=>items[yToIdx(posY)]};
}

function initPickers(){
  buildPicker('pl-sh','p-sh',HOURS,'09');
  buildPicker('pl-sm','p-sm',MINS,'00');
  buildPicker('pl-eh','p-eh',HOURS,'17');
  buildPicker('pl-em','p-em',MINS,'00');
}
function getPickerTime(hId,mId){
  return `${pickerState[hId]?.getValue()?? '09'}:${pickerState[mId]?.getValue()?? '00'}`;
}

window.openModal=function(key){
  activeDate=key;
  const dt=pd(key);
  const dow=['日','月','火','水','木','金','土'];
  document.getElementById('modalTitle').textContent=`${dt.getMonth()+1}月${dt.getDate()}日（${dow[dt.getDay()]}）`;
  const ss=shiftsOn(key);
  const ex=document.getElementById('modalExisting');
  if(ss.length){
    ex.innerHTML='<div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:8px">登録済みシフト</div>'+
      ss.map(s=>`<div class="shift-list-item" id="sli-${s.id}">
        <div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:center;gap:6px">
            <input class="sli-input" value="${s.start}" onchange="updateShift('${s.id}','start',this.value)" style="width:52px">
            <span style="color:var(--text3);font-size:12px">〜</span>
            <input class="sli-input" value="${s.end}" onchange="updateShift('${s.id}','end',this.value)" style="width:52px">
            <span style="font-size:11px;color:var(--text3)">休憩</span>
            <input class="sli-input" type="number" value="${s.breakMin||0}" onchange="updateShift('${s.id}','breakMin',+this.value)" style="width:40px" min="0">
            <span style="font-size:11px;color:var(--text3)">分</span>
          </div>
          <div class="sli-amt" style="font-size:11px;color:var(--ok);font-family:'Rajdhani',sans-serif;font-weight:700">${fm(calcShift(s))}</div>
        </div>
        <button class="btn btn-danger btn-xs" onclick="removeShift('${s.id}')">削除</button>
      </div>`).join('');
  } else ex.innerHTML='';
  document.getElementById('m-break').value='0';
  document.getElementById('m-memo').value='';
  document.getElementById('overlay').className='overlay open';
  initPickers();
};
window.closeModal=function(){document.getElementById('overlay').className='overlay';activeDate=null;};
window.overlayClick=function(e){if(e.target===document.getElementById('overlay'))closeModal();};
window.saveShift=function(){
  if(!activeDate) return;
  const start=getPickerTime('pl-sh','pl-sm');
  const end=getPickerTime('pl-eh','pl-em');
  const breakMin=+document.getElementById('m-break').value||0;
  const memo=document.getElementById('m-memo').value.trim();
  if(!S.shifts) S.shifts=[];
  S.shifts.push({id:uid(),date:activeDate,start,end,breakMin,memo});
  saveToFirebase(); closeModal(); renderCal(); renderDash();
  showSyncStatus('保存中...');
};
window.removeShift=function(id){
  S.shifts=S.shifts.filter(s=>s.id!==id);
  saveToFirebase();
  if(activeDate) openModal(activeDate);
  renderCal(); renderDash();
};
window.updateShift=function(id,field,val){
  const s=S.shifts.find(s=>s.id===id);
  if(!s) return;
  s[field]=val;
  saveToFirebase();
  const amtEl=document.querySelector('#sli-'+id+' .sli-amt');
  if(amtEl) amtEl.textContent=fm(calcShift(s));
  renderCal(); renderDash();
};

/* ===== WAGE ===== */
window.renderWageList=function(){
  const el=document.getElementById('wageList');
  if(!S.wages||!S.wages.length){el.innerHTML='<div class="empty-state">時給が設定されていません</div>';return;}
  el.innerHTML=S.wages.sort((a,b)=>(pd(a.start)||0)-(pd(b.start)||0)).map((w,i)=>`
    <div class="wage-item">
      <div class="wage-period">${w.start} 〜 ${w.end||'無期限'}</div>
      <div class="wage-rate">¥${w.rate.toLocaleString()}/h</div>
      <button class="btn btn-danger btn-xs" onclick="removeWage(${i})">削除</button>
    </div>`).join('');
};
window.addWage=function(){
  const startRaw=document.getElementById('w-start').value;
  const endRaw=document.getElementById('w-end').value;
  const rate=+document.getElementById('w-rate').value;
  if(!startRaw||!rate){alert('開始日と時給を入力してください');return;}
  function toSlash(s){ return s?s.replace(/-/g,'/'):'';}
  const start=toSlash(startRaw);
  const end=toSlash(endRaw);
  if(!S.wages) S.wages=[];
  S.wages.push({start,end,rate});
  saveToFirebase(); renderWageList(); renderDash();
  document.getElementById('w-start').value='';
  document.getElementById('w-end').value='';
  document.getElementById('w-rate').value='';
  showSyncStatus('保存中...');
};
window.removeWage=function(i){S.wages.splice(i,1);saveToFirebase();renderWageList();renderDash();};

/* ===== SHIFT EXCEL IMPORT ===== */
let scanRows = [];

window.openScanModal = function(){
  document.getElementById('scanOverlay').className = 'overlay open';
  document.getElementById('scanStatus').textContent = '';
  document.getElementById('scanStatus').style.color = 'var(--text2)';
  document.getElementById('scanResult').style.display = 'none';
  document.getElementById('scanBtnRow').style.display = 'none';
  document.getElementById('scanFileInput').value = '';
  scanRows = [];
};
window.closeScanModal = function(){
  document.getElementById('scanOverlay').className = 'overlay';
};
window.scanOverlayClick = function(e){
  if(e.target === document.getElementById('scanOverlay')) closeScanModal();
};

window.onExcelSelected = function(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('scanStatus').textContent = '📊 Excelを読み取り中...';
  document.getElementById('scanStatus').style.color = 'var(--accent)';
  document.getElementById('scanResult').style.display = 'none';
  document.getElementById('scanBtnRow').style.display = 'none';

  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array', cellText: true, cellDates: false });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      scanRows = [];
      const year = S.year || 2026;

      for(const row of rows){
        const dateCell = String(row[0] || '').trim();   // A列: 6/02 形式
        const kindCell = String(row[2] || '').trim();   // C列: ●出勤
        const startCell = String(row[3] || '').trim();  // D列: 17:30
        const endCell   = String(row[4] || '').trim();  // E列: 21:00

        // ●出勤 かつ 時刻が入っている行だけ
        if(!kindCell.includes('出勤') && !kindCell.includes('●')) continue;
        if(!startCell.match(/^\d{1,2}:\d{2}$/) || !endCell.match(/^\d{1,2}:\d{2}$/)) continue;

        // 日付パース: 6/02 → 2026/06/02
        const dmatch = dateCell.match(/(\d{1,2})\/(\d{1,2})/);
        if(!dmatch) continue;
        const mo = String(+dmatch[1]).padStart(2,'0');
        const dy = String(+dmatch[2]).padStart(2,'0');
        const dateStr = `${year}/${mo}/${dy}`;

        scanRows.push({ date: dateStr, start: startCell, end: endCell, breakMin: 0 });
      }

      if(scanRows.length === 0){
        document.getElementById('scanStatus').textContent = '⚠️ シフトが見つかりませんでした。ファイルを確認してください。';
        document.getElementById('scanStatus').style.color = 'var(--warn)';
        return;
      }

      renderScanTable();
      document.getElementById('scanStatus').textContent = `✅ ${scanRows.length}件のシフトを読み取りました。内容を確認してください。`;
      document.getElementById('scanStatus').style.color = 'var(--ok)';
      document.getElementById('scanResult').style.display = 'block';
      document.getElementById('scanBtnRow').style.display = 'flex';
    } catch(err) {
      document.getElementById('scanStatus').textContent = '❌ 読み取りに失敗しました: ' + err.message;
      document.getElementById('scanStatus').style.color = 'var(--danger)';
    }
  };
  reader.readAsArrayBuffer(file);
};

function renderScanTable(){
  const tbody = document.getElementById('scanTableBody');
  tbody.innerHTML = scanRows.map((row, i) => `
    <tr id="scan-row-${i}">
      <td><input value="${row.date}" onchange="scanRows[${i}].date=this.value" style="width:88px"></td>
      <td><input value="${row.start}" onchange="scanRows[${i}].start=this.value" style="width:52px"></td>
      <td><input value="${row.end}" onchange="scanRows[${i}].end=this.value" style="width:52px"></td>
      <td><input value="${row.breakMin||0}" onchange="scanRows[${i}].breakMin=+this.value" style="width:40px" type="number"></td>
      <td><button class="del-row" onclick="deleteScanRow(${i})">×</button></td>
    </tr>`).join('');
}

window.deleteScanRow = function(i){
  scanRows.splice(i, 1);
  renderScanTable();
};

window.applyScanResults = function(){
  if(!scanRows.length){ alert('シフトがありません'); return; }
  let added = 0, skipped = 0;
  for(const row of scanRows){
    if(!row.date || !row.start || !row.end){ skipped++; continue; }
    const dup = S.shifts.find(s => s.date === row.date && s.start === row.start && s.end === row.end);
    if(dup){ skipped++; continue; }
    S.shifts.push({ id: uid(), date: row.date, start: row.start, end: row.end, breakMin: row.breakMin||0, memo: '' });
    added++;
  }
  saveToFirebase();
  closeScanModal();
  renderCal();
  renderDash();
  const mo = scanRows[0] ? (new Date(scanRows[0].date).getMonth()) : calMonth;
  calMonth = mo;
  renderCal();
  alert(`${added}件のシフトを反映しました。（重複スキップ：${skipped}件）`);
};

calMonth=new Date().getMonth();
</script>

      </div>
    </div>
    <div class="header-right">
      <span class="year-badge" id="yearBadge">2026年</span>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('dash')">ダッシュボード</button>
      <button class="tab" onclick="showTab('cal')">カレンダー</button>
      <button class="tab" onclick="showTab('wage')">時給設定</button>
      <button class="tab" onclick="showTab('cfg')">設定</button>
    </div>

    <div id="tab-dash" style="margin-top:16px">
      <div id="alertArea"></div>
      <div class="metric-grid">
        <div class="metric"><div class="metric-label">年間収入</div><div class="metric-value" id="m-total">¥0円</div></div>
        <div class="metric"><div class="metric-label">残り枠</div><div class="metric-value ok" id="m-remain">¥0円</div></div>
        <div class="metric"><div class="metric-label">残り月平均</div><div class="metric-value" id="m-avg">¥0円</div></div>
        <div class="metric"><div class="metric-label">今月の収入</div><div class="metric-value" id="m-cur">¥0円</div></div>
      </div>
      <div class="card">
        <div class="progress-header">
          <span style="font-size:13px;font-weight:700;color:var(--text2);font-family:'Nunito',sans-serif">年間進捗</span>
          <span class="progress-pct" id="pct-label">0%</span>
        </div>
        <div class="pbar"><div class="pfill ok" id="pfill" style="width:0%"></div></div>
        <div class="progress-footer"><span>¥0</span><span id="limit-label">上限 ¥1,230,000</span></div>
      </div>
      <div class="month-list-label">月別収入</div><div class="month-list" id="monthRow"></div>

    </div>

    <div id="tab-cal" style="display:none;margin-top:16px">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calPrev()">&#8249;</button>
        <span class="cal-nav-title" id="calTitle">2026年1月</span>
        <button class="cal-nav-btn" onclick="calNext()">&#8250;</button>
      </div>
      <div style="margin-bottom:10px">
        <button class="btn btn-primary" style="width:100%;font-size:13px" onclick="openScanModal()">📊 Excelからシフトを読み込む</button>
      </div>
      <div class="card" style="padding:12px">
        <div class="cal-grid">
          <div class="cal-dow">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div>
          <div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow">土</div>
        </div>
        <div class="cal-grid" id="calBody" style="margin-top:3px"></div>
      </div>
      <div class="cal-summary" id="calSummary"></div>
    </div>

    <div id="tab-wage" style="display:none;margin-top:16px">
      <div class="card">
        <div class="card-title">時給を追加</div>
        <div class="row3">
          <div><label>開始日</label><input type="date" id="w-start"></div>
          <div><label>終了日（空白=無期限）</label><input type="date" id="w-end"></div>
          <div><label>時給（円）</label><input type="number" id="w-rate" placeholder="1120" min="0"></div>
        </div>
        <div class="flex-end"><button class="btn btn-primary" onclick="addWage()">＋ 追加</button></div>
      </div>
      <div class="card">
        <div class="card-title">設定済み時給</div>
        <div id="wageList"></div>
      </div>
    </div>

    <div id="tab-cfg" style="display:none;margin-top:16px">
      <div class="card">
        <div class="section-label">年収上限</div>
        <div style="margin-bottom:14px">
          <div style="margin-bottom:8px">
            <button class="btn" onclick="setLimit(1230000)" style="margin-right:6px;margin-bottom:6px">123万円</button>
          </div>
          <div class="flex-row">
            <label style="display:inline;margin:0;white-space:nowrap">カスタム（円）：</label>
            <input type="number" id="customLimit" placeholder="例：1230000" style="width:180px">
            <button class="btn btn-primary" onclick="setCustomLimit()">設定</button>
          </div>
        </div>
        <div style="font-size:13px;color:var(--text2)">現在の上限：<span id="limitDisp" style="font-weight:700;color:var(--text);font-family:'Rajdhani',sans-serif">¥1,230,000</span></div>
        <div class="separator"></div>
        <div class="section-label">対象年</div>
        <div class="flex-row">
          <input type="number" id="cfgYear" value="2026" min="2020" max="2040" style="width:110px">
          <button class="btn" onclick="setYear()">適用</button>
        </div>
        <div class="separator"></div>
        <div class="section-label" style="color:var(--danger)">データ管理</div>
        <button class="btn btn-danger" onclick="clearAll()">全データを削除</button>
      </div>
    </div>
  </div>
</div>

<!-- シフトExcel読み込みモーダル -->
<div class="overlay" id="scanOverlay" onclick="scanOverlayClick(event)">
  <div class="scan-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;color:var(--text);font-family:'Nunito',sans-serif">Excelからシフトを読み込む</div>
      <button onclick="closeScanModal()" style="background:none;border:none;font-size:20px;color:var(--text2);cursor:pointer;line-height:1">×</button>
    </div>
    <div class="upload-area" onclick="document.getElementById('scanFileInput').click()">
      <input type="file" id="scanFileInput" accept=".xlsx,.xls" onchange="onExcelSelected(event)">
      <div class="upload-icon" style="font-size:32px;margin-bottom:8px">📊</div>
      <div class="upload-text">タップしてExcelを選択</div>
      <div class="upload-sub">シフト表の .xlsx ファイルをアップロード</div>
    </div>
    <div class="scan-status" id="scanStatus"></div>
    <div class="scan-result" id="scanResult" style="display:none">
      <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:8px;font-family:'Nunito',sans-serif">読み取り結果（修正できます）</div>
      <table class="scan-table">
        <thead><tr><th>日付</th><th>開始</th><th>終了</th><th>休憩</th><th></th></tr></thead>
        <tbody id="scanTableBody"></tbody>
      </table>
    </div>
    <div class="scan-btn-row" id="scanBtnRow" style="display:none">
      <button class="btn" style="flex:1;font-size:12px" onclick="closeScanModal()">キャンセル</button>
      <button class="btn btn-primary" style="flex:2;font-size:12px" onclick="applyScanResults()">カレンダーに反映する</button>
    </div>
  </div>
</div>

<!-- シフト入力モーダル -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">シフト入力</div>
    <div id="modalExisting"></div>
    <hr class="divider">
    <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:12px;font-family:'Nunito',sans-serif">新しいシフトを追加</div>
    <div class="pickers-row" style="margin-bottom:14px;justify-content:center">
      <div class="picker-group">
        <div class="picker-group-label">開始</div>
        <div class="picker-pair">
          <div class="drum-col" id="p-sh"><div class="drum-selector"></div><div class="drum-list" id="pl-sh"></div><div class="drum-mask"></div></div>
          <span class="picker-colon">:</span>
          <div class="drum-col" id="p-sm"><div class="drum-selector"></div><div class="drum-list" id="pl-sm"></div><div class="drum-mask"></div></div>
        </div>
      </div>
      <div style="align-self:center;font-size:22px;color:var(--text3);font-weight:700;padding-top:18px">〜</div>
      <div class="picker-group">
        <div class="picker-group-label">終了</div>
        <div class="picker-pair">
          <div class="drum-col" id="p-eh"><div class="drum-selector"></div><div class="drum-list" id="pl-eh"></div><div class="drum-mask"></div></div>
          <span class="picker-colon">:</span>
          <div class="drum-col" id="p-em"><div class="drum-selector"></div><div class="drum-list" id="pl-em"></div><div class="drum-mask"></div></div>
        </div>
      </div>
    </div>
    <div class="break-row">
      <div><label>休憩（分）</label><input type="number" id="m-break" value="0" min="0"></div>
      <div><label>メモ（任意）</label><input type="text" id="m-memo" placeholder=""></div>
    </div>
    <div class="flex-end">
      <button class="btn btn-sm" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary btn-sm" onclick="saveShift()">追加</button>
    </div>
  </div>
</div>

</body>
</html>
