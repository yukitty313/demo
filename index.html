function saveToFirebase(){

}

}

/* ===== HELPERS ===== */
function pd(s){ if(!s)return null; const m=s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function pt(s){ if(!s)return null; const m=s.match(/(\d{1,2}):(\d{2})/); return m?+m[1]*60+ +m[2]:null; }
function fm(n){ return '¥'+Math.round(n).toLocaleString('ja-JP')+'円'; }
function fms(n){ return '¥'+Math.round(n).toLocaleString('ja-JP'); }
function dateKey(y,mo,d){ return `${y}/${String(mo+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function uid(){ return Math.random().toString(36).slice(2,9); }

function wageFor(ds){
  const dt=pd(ds); if(!dt) return 1000;
  let best=null;
  for(const w of S.wages){
    const ws=pd(w.start), we=w.end?pd(w.end):new Date(2099,11,31);
    if(ws&&we&&dt>=ws&&dt<=we){ if(!best||pd(w.start)>=pd(best.start)) best=w; }
  }
  return best?best.rate:1000;
}
function calcShift(sh){
  const st=pt(sh.start),et=pt(sh.end); if(st===null||et===null) return 0;
  let m=et-st; if(m<0)m+=1440; m-=(sh.breakMin||0);
  return Math.max(0,m/60)*wageFor(sh.date);
}
function calcHours(sh){
  const st=pt(sh.start),et=pt(sh.end); if(st===null||et===null) return 0;
  let m=et-st; if(m<0)m+=1440; m-=(sh.breakMin||0); return Math.max(0,m/60);
}
function monthlyData(){
  const amt=Array(12).fill(0), hrs=Array(12).fill(0);
  for(const s of S.shifts){
    const dt=pd(s.date); if(!dt||dt.getFullYear()!==S.year) continue;
    const mo=dt.getMonth(); amt[mo]+=calcShift(s); hrs[mo]+=calcHours(s);
  }
  return{amt,hrs};
}
function shiftsOn(key){ return S.shifts.filter(s=>s.date===key); }

/* ===== DASHBOARD ===== */
window.renderDash = function(){
  if(!document.getElementById('m-total')) return;
  const{amt,hrs}=monthlyData();
  const total=amt.reduce((a,b)=>a+b,0);
  const remain=Math.max(0,S.limit-total);
  const now=new Date(), curMo=now.getMonth();
  const remMos=now.getFullYear()===S.year?Math.max(1,12-curMo):12;
  const avg=remain/remMos;
  const pct=Math.min(100,total/S.limit*100);
  const cls=pct<70?'ok':pct<90?'warn':'danger';

  document.getElementById('m-total').textContent=fm(total);
  document.getElementById('m-total').className='metric-value '+cls;
  document.getElementById('m-remain').textContent=fm(remain);
  document.getElementById('m-avg').textContent=fm(avg);
  document.getElementById('m-cur').textContent=fm(amt[curMo]||0);
  document.getElementById('pct-label').textContent=Math.round(pct)+'%';
  const pf=document.getElementById('pfill');
  pf.style.width=pct+'%'; pf.className='pfill '+cls;
  document.getElementById('limit-label').textContent='上限 '+fms(S.limit);
  document.getElementById('yearBadge').textContent=S.year+'年';

  const aa=document.getElementById('alertArea');
  if(pct>=90) aa.innerHTML=`<div class="alert danger">⚠️ 年収上限の${Math.round(pct)}%に達しています。残り${fm(remain)}です。</div>`;
  else if(pct>=70) aa.innerHTML=`<div class="alert warn">📊 上限の${Math.round(pct)}%に到達。残り${fm(remain)}（月平均${fm(avg)}）</div>`;
  else aa.innerHTML='';

  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const maxAmt=Math.max(...amt,1);
  // 月別日数を集計
  const days=Array(12).fill(0);
  for(const s of S.shifts){
    const dt=pd(s.date); if(!dt||dt.getFullYear()!==S.year) continue;
    days[dt.getMonth()]++;
  }
  document.getElementById('monthRow').innerHTML=mn.map((n,i)=>{
    const isCur=i===curMo&&now.getFullYear()===S.year;
    const hasData=amt[i]>0;
    const pct=Math.round(amt[i]/maxAmt*100);
    return `<div class="month-card ${isCur?'cur':''} ${hasData?'has-data':''}" onclick="jumpMonth(${i})">
      <div class="mc-bg" style="width:${pct}%"></div>
      <div class="mname">${n}</div>
      <div class="mamt ${hasData?'':'zero'}" style="flex:1;padding:0 8px">${fms(amt[i])}</div>
      ${hasData
        ? `<div class="mc-sub"><span class="mc-hrs-badge">${hrs[i].toFixed(1)}h</span><span class="mc-days-badge">${days[i]}日</span></div>`
        : `<span class="mc-zero">—</span>`
      }
    </div>`;
  }).join('');
};


/* ===== CALENDAR ===== */
window.renderCal = function(){
  const mn=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent=calYear+'年'+mn[calMonth];
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  const cellCount=Math.ceil((first+days)/7)*7;
  let html='';
  for(let i=0;i<cellCount;i++){
    let d,mo,yr,other=false;
    if(i<first){d=prevDays-first+i+1;mo=calMonth-1;yr=calYear;if(mo<0){mo=11;yr--;}other=true;}
    else if(i>=first+days){d=i-first-days+1;mo=calMonth+1;yr=calYear;if(mo>11){mo=0;yr++;}other=true;}
    else{d=i-first+1;mo=calMonth;yr=calYear;}
    const dow=i%7;
    const key=dateKey(yr,mo,d);
    const ss=other?[]:shiftsOn(key);
    const isToday=yr===today.getFullYear()&&mo===today.getMonth()&&d===today.getDate();
    let cls='cal-cell';
    if(dow===0)cls+=' sun'; if(dow===6)cls+=' sat';
    if(other)cls+=' other'; if(isToday)cls+=' today'; if(ss.length)cls+=' has-shift';
    let inner=`<span class="day-num">${d}</span>`;
    for(const s of ss) inner+=`<span class="shift-badge">${s.start}\n${s.end}</span>`;
    if(ss.length) inner+=`<span class="shift-amt">${fms(ss.reduce((a,s2)=>a+calcShift(s2),0))}</span>`;
    const ca=other?'':`onclick="openModal('${key}')"`;
    html+=`<div class="${cls}" ${ca}>${inner}</div>`;
  }
  document.getElementById('calBody').innerHTML=html;
  const mShifts=S.shifts.filter(s=>{const dt=pd(s.date);return dt&&dt.getFullYear()===calYear&&dt.getMonth()===calMonth;});
  const mTotal=mShifts.reduce((a,s)=>a+calcShift(s),0);
  const mHrs=mShifts.reduce((a,s)=>a+calcHours(s),0);
  document.getElementById('calSummary').textContent=mn[calMonth]+'合計：'+fm(mTotal)+'（'+mHrs.toFixed(1)+'時間 / '+mShifts.length+'日）';
};

window.calPrev=function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); };
window.calNext=function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); };
window.jumpMonth=function(m){ calYear=S.year; calMonth=m; showTab('cal'); };

/* ===== iOS PICKER ===== */
const ITEM_H=44;
const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const MINS=['00','15','30','45'];
const pickerState={};

function buildPicker(listId,colId,items,initVal){
  const listEl=document.getElementById(listId);
  const colEl=document.getElementById(colId);
  if(!listEl||!colEl) return;
  listEl.innerHTML='';
  const n=items.length;
  for(let c=0;c<3;c++) items.forEach(v=>{
    const div=document.createElement('div');
    div.className='drum-list-item';
    div.textContent=v;
    listEl.appendChild(div);
  });
  let initIdx=items.indexOf(initVal); if(initIdx<0)initIdx=0;
  function idxToY(idx){ return -((n+idx)*ITEM_H)+2*ITEM_H; }
  function yToIdx(y){ return ((Math.round((-y+2*ITEM_H)/ITEM_H)-n)%n+n)%n; }
  let posY=idxToY(initIdx), velY=0, rafId=null, isDragging=false;
  let currentIdx=initIdx; // 確定インデックスを別管理
  function updateDOM(){
    listEl.style.transform=`translateY(${posY}px)`;
    const ci=yToIdx(posY);
    currentIdx=ci; // 常に最新を追跡
    listEl.querySelectorAll('.drum-list-item').forEach((el,k)=>{
      const sel=(k%n)===ci;
      el.style.color=sel?'#ffffff':'#00aaff40';
      el.style.fontSize=sel?'22px':'15px';
      el.style.fontWeight=sel?'700':'400';
    });
  }
  function snapNearest(){ return idxToY(yToIdx(posY)); }
  function physicsLoop(){
    if(isDragging){rafId=requestAnimationFrame(physicsLoop);return;}
    const target=snapNearest(), dist=target-posY;
    velY=velY*0.78+dist*0.18;
    if(Math.abs(velY)<0.15&&Math.abs(dist)<0.2){
      posY=target;velY=0;
      currentIdx=yToIdx(posY); // スナップ完了時に確定
      updateDOM();rafId=null;return;
    }
    posY+=velY;updateDOM();
    rafId=requestAnimationFrame(physicsLoop);
  }
  function startLoop(){ if(!rafId) rafId=requestAnimationFrame(physicsLoop); }
  listEl.style.transition='none';
  updateDOM();
  let dragStartY=0,dragStartPos=0,samples=[];
  function pointerStart(clientY){
    isDragging=true;dragStartY=clientY;dragStartPos=posY;
    samples=[{y:clientY,t:performance.now()}];velY=0;
    if(!rafId) rafId=requestAnimationFrame(physicsLoop);
  }
  function pointerMove(clientY){
    if(!isDragging) return;
    posY=dragStartPos+(clientY-dragStartY);
    const minY=idxToY(n-1)-ITEM_H*2, maxY=idxToY(0)+ITEM_H*2;
    if(posY<minY)posY=minY; if(posY>maxY)posY=maxY;
    const now=performance.now();
    samples.push({y:clientY,t:now});
    samples=samples.filter(s=>now-s.t<80);
    updateDOM();
  }
  function pointerEnd(){
    if(!isDragging) return;
    isDragging=false;
    if(samples.length>=2){
      const first=samples[0],last=samples[samples.length-1],dt=last.t-first.t;
      if(dt>0) velY=(last.y-first.y)/dt*16;
    } else velY=0;
    startLoop();
  }
  colEl.addEventListener('mousedown',e=>{pointerStart(e.clientY);e.preventDefault();});
  colEl._pickerMove=e=>{if(isDragging)pointerMove(e.clientY);};
  colEl._pickerUp=()=>{if(isDragging)pointerEnd();};
  colEl.addEventListener('touchstart',e=>{pointerStart(e.touches[0].clientY);},{passive:true});
  colEl.addEventListener('touchmove',e=>{pointerMove(e.touches[0].clientY);e.preventDefault();},{passive:false});
  colEl.addEventListener('touchend',()=>{pointerEnd();});
  colEl.addEventListener('wheel',e=>{
    e.preventDefault();velY+=e.deltaY>0?-60:60;startLoop();
  },{passive:false});
  pickerState[listId]={getValue:()=>items[currentIdx]};
}

function initPickers(){
  buildPicker('pl-sh','p-sh',HOURS,'09');

window.saveShift=function(){
  if(!activeDate) return;
  const start=getPickerTime('pl-sh','pl-sm');
  const end=getPickerTime('pl-eh','pl-em');
  const breakMin=+document.getElementById('m-break').value||0;

let scanRows = [];

window.openScanModal = function(){
  document.getElementById('scanOverlay').className = 'overlay open';
  document.getElementById('scanStatus').textContent = '';
  document.getElementById('scanStatus').style.color = 'var(--text2)';
  document.getElementById('scanResult').style.display = 'none';
  document.getElementById('scanBtnRow').style.display = 'none';
  document.getElementById('scanFileInput').value = '';
  scanRows = [];
};
window.closeScanModal = function(){
  document.getElementById('scanOverlay').className = 'overlay';
};
window.scanOverlayClick = function(e){
  if(e.target === document.getElementById('scanOverlay')) closeScanModal();
};

window.onExcelSelected = function(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('scanStatus').textContent = '📊 Excelを読み取り中...';
  document.getElementById('scanStatus').style.color = 'var(--accent)';
  document.getElementById('scanResult').style.display = 'none';
  document.getElementById('scanBtnRow').style.display = 'none';

  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array', cellText: true, cellDates: false });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      scanRows = [];
      const year = S.year || 2026;

      for(const row of rows){
        const dateCell = String(row[0] || '').trim();   // A列: 6/02 形式
        const kindCell = String(row[2] || '').trim();   // C列: ●出勤
        const startCell = String(row[3] || '').trim();  // D列: 17:30
        const endCell   = String(row[4] || '').trim();  // E列: 21:00

        // ●出勤 かつ 時刻が入っている行だけ
        if(!kindCell.includes('出勤') && !kindCell.includes('●')) continue;
        if(!startCell.match(/^\d{1,2}:\d{2}$/) || !endCell.match(/^\d{1,2}:\d{2}$/)) continue;

        // 日付パース: 6/02 → 2026/06/02
        const dmatch = dateCell.match(/(\d{1,2})\/(\d{1,2})/);
        if(!dmatch) continue;
        const mo = String(+dmatch[1]).padStart(2,'0');
        const dy = String(+dmatch[2]).padStart(2,'0');
        const dateStr = `${year}/${mo}/${dy}`;

        scanRows.push({ date: dateStr, start: startCell, end: endCell, breakMin: 0 });
      }

      if(scanRows.length === 0){
        document.getElementById('scanStatus').textContent = '⚠️ シフトが見つかりませんでした。ファイルを確認してください。';
        document.getElementById('scanStatus').style.color = 'var(--warn)';
        return;
      }

      renderScanTable();
      document.getElementById('scanStatus').textContent = `✅ ${scanRows.length}件のシフトを読み取りました。内容を確認してください。`;
      document.getElementById('scanStatus').style.color = 'var(--ok)';
      document.getElementById('scanResult').style.display = 'block';
      document.getElementById('scanBtnRow').style.display = 'flex';
    } catch(err) {
      document.getElementById('scanStatus').textContent = '❌ 読み取りに失敗しました: ' + err.message;
      document.getElementById('scanStatus').style.color = 'var(--danger)';
    }
  };
  reader.readAsArrayBuffer(file);
};

function renderScanTable(){
  const tbody = document.getElementById('scanTableBody');
  tbody.innerHTML = scanRows.map((row, i) => `
    <tr id="scan-row-${i}">
      <td><input value="${row.date}" onchange="scanRows[${i}].date=this.value" style="width:88px"></td>
      <td><input value="${row.start}" onchange="scanRows[${i}].start=this.value" style="width:52px"></td>
      <td><input value="${row.end}" onchange="scanRows[${i}].end=this.value" style="width:52px"></td>
      <td><input value="${row.breakMin||0}" onchange="scanRows[${i}].breakMin=+this.value" style="width:40px" type="number"></td>
      <td><button class="del-row" onclick="deleteScanRow(${i})">×</button></td>
    </tr>`).join('');
}

window.deleteScanRow = function(i){
  scanRows.splice(i, 1);
  renderScanTable();
};

window.applyScanResults = function(){
  if(!scanRows.length){ alert('シフトがありません'); return; }
  let added = 0, skipped = 0;
  for(const row of scanRows){
    if(!row.date || !row.start || !row.end){ skipped++; continue; }
    const dup = S.shifts.find(s => s.date === row.date && s.start === row.start && s.end === row.end);
    if(dup){ skipped++; continue; }
    S.shifts.push({ id: uid(), date: row.date, start: row.start, end: row.end, breakMin: row.breakMin||0, memo: '' });
    added++;
  }
  saveToFirebase();
  closeScanModal();
  renderCal();
  renderDash();
  const mo = scanRows[0] ? (new Date(scanRows[0].date).getMonth()) : calMonth;
  calMonth = mo;
  renderCal();
  alert(`${added}件のシフトを反映しました。（重複スキップ：${skipped}件）`);
};

calMonth=new Date().getMonth();

.mc-bg{position:absolute;left:0;top:0;bottom:0;background:rgba(0,153,255,.05);pointer-events:none}
.mname{font-size:11px;font-weight:700;color:#00aaff90;width:28px;flex-shrink:0;font-family:'Orbitron',sans-serif}
.month-card.cur .mname{color:#ffffff;text-shadow:0 0 8px #00ddff,0 0 16px #00ddff,0 0 32px #00ddff}
.mc-mid{flex:1;padding:0 10px}
.mamt{font-size:14px;font-weight:700;color:#ffffff;font-family:'Quantico',sans-serif;line-height:1.1;text-shadow:0 0 8px #00aaff,0 0 18px #00aaff80}
.mamt.zero{color:#00aaff35;text-shadow:none}
.mhrs{font-size:10px;color:var(--text3);font-family:'Rajdhani',sans-serif;margin-top:1px}
.mc-sub{display:flex;gap:5px;align-items:center;flex-shrink:0}
.mc-hrs-badge{font-size:11px;font-weight:600;color:#ffffff;font-family:'Quantico',sans-serif;background:#00aaff20;padding:2px 7px;border-radius:3px;white-space:nowrap;border:1px solid #00aaff60;box-shadow:0 0 10px #00aaff50;text-shadow:0 0 8px #00aaff,0 0 16px #00aaff}
.mc-days-badge{font-size:11px;font-weight:600;color:#aaddff;font-family:'Quantico',sans-serif;background:#00aaff12;padding:2px 7px;border-radius:3px;white-space:nowrap;border:1px solid #00aaff35}
.mc-zero{font-size:11px;color:var(--text3);flex-shrink:0}
.month-list-label{font-size:9px;font-weight:700;color:#0099ff60;margin-bottom:8px;letter-spacing:2px;font-family:'Orbitron',sans-serif}
.chart-wrap{position:relative;width:100%;height:200px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-title{font-size:13px;font-weight:900;color:#66ccff;font-family:'Orbitron',sans-serif;letter-spacing:2px}
.cal-nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:#0099ff;font-weight:700}
.cal-nav-btn:hover{background:var(--accent-light);border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:9px;font-weight:700;padding:5px 0 4px;color:#0099ff60;font-family:'Orbitron',sans-serif}
.cal-dow:first-child{color:#ff4466}.cal-dow:last-child{color:#0099ff}
.cal-cell{min-height:72px;border:1px solid #00aaff20;border-radius:4px;padding:4px;cursor:pointer;background:#0a1525;transition:all .12s;overflow:hidden}
.cal-cell:hover{border-color:#00aaff60;background:#0d1e33;box-shadow:0 0 10px #00aaff20}
.cal-cell.other{background:#031018;opacity:.3;pointer-events:none}
.cal-cell.today{border-color:#00ddff;border-width:1.5px;background:#0d1e33;box-shadow:0 0 14px #00ddff30,inset 0 0 8px #00ddff10}
.cal-cell.has-shift{background:#0a1e35;border-color:#00aaff50;box-shadow:0 0 10px #00aaff18}
.day-num{font-size:10px;font-weight:700;color:#00aaff80;line-height:1;font-family:'Orbitron',sans-serif}
.cal-cell.sun .day-num{color:#ff4466}.cal-cell.sat .day-num{color:#66ccff}
.shift-badge{display:block;font-size:10px;color:#aaddff;background:#00aaff18;border-radius:2px;padding:1px 3px;margin-top:2px;white-space:pre-line;line-height:1.35;font-family:'Quantico',sans-serif;font-weight:400}
.shift-amt{display:block;font-size:10px;font-weight:700;color:#ffffff;margin-top:1px;font-family:'Quantico',sans-serif;text-shadow:0 0 8px #00aaff,0 0 16px #00aaff80}
.cal-summary{font-size:11px;color:#0099ff80;margin-top:6px;margin-bottom:4px;font-weight:400;font-family:'Quantico',sans-serif;text-align:right}
.overlay{display:none;position:fixed;inset:0;background:rgba(28,42,94,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.scan-modal{background:var(--surface);border-radius:var(--radius);padding:20px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,153,255,.2);border:1px solid #0099ff40;max-height:90vh;overflow-y:auto}
.upload-area{border:1px dashed #0099ff50;border-radius:var(--radius-sm);padding:24px 16px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface2)}
.upload-area:hover{border-color:#0099ff;background:#041e33}
.upload-area input{display:none}
.upload-icon{font-size:32px;margin-bottom:8px}
.upload-text{font-size:13px;color:#66ccff;font-weight:600;font-family:'Orbitron',sans-serif}
.upload-sub{font-size:11px;color:var(--text3);margin-top:4px}
.preview-img{width:100%;max-height:180px;object-fit:contain;border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:10px}
.scan-result{margin-top:14px}
.scan-table{width:100%;border-collapse:collapse;font-size:12px}
.scan-table th{text-align:left;padding:6px 8px;font-weight:700;color:#0099ff80;border-bottom:1px solid var(--border);font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.5px}
.scan-table td{padding:6px 8px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:middle}
.scan-table input{width:100%;padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-family:'Rajdhani',sans-serif}
.scan-table tr:last-child td{border-bottom:none}
.del-row{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0 4px;line-height:1}
.scan-status{font-size:12px;font-weight:600;color:var(--text2);margin-top:10px;text-align:center;font-family:'Nunito',sans-serif;min-height:20px}
.scan-btn-row{display:flex;gap:8px;margin-top:12px}
.import-btn{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap}
.import-btn:hover{background:rgba(255,255,255,.28)}
.modal{background:var(--surface);border-radius:var(--radius);padding:22px;width:100%;max-width:400px;box-shadow:0 0 40px #00aaff25,0 8px 40px rgba(0,170,255,.15);border:1px solid #00aaff50}
.modal-title{font-size:16px;font-weight:800;margin-bottom:14px;color:var(--text);font-family:'Nunito',sans-serif}
.picker-section-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;font-family:'Nunito',sans-serif}
.pickers-row{display:flex;gap:24px}
.picker-group{display:flex;flex-direction:column;align-items:center;gap:6px}
.picker-group-label{font-size:11px;color:var(--text3);font-weight:700;font-family:'Nunito',sans-serif}
.picker-pair{display:flex;align-items:center;gap:2px}
.picker-colon{font-size:24px;font-weight:700;color:var(--text2);line-height:1;padding:0 2px;align-self:center}
.drum-col{width:52px;height:calc(var(--item-h)*var(--visible));overflow:hidden;position:relative;cursor:grab;user-select:none;-webkit-user-select:none}
.drum-col:active{cursor:grabbing}
.drum-list{position:absolute;left:0;right:0;top:0;will-change:transform}
.drum-list-item{height:var(--item-h);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:500;color:var(--text3);user-select:none;-webkit-user-select:none}
.drum-selector{position:absolute;top:calc(var(--item-h)*2);left:0;right:0;height:var(--item-h);pointer-events:none;z-index:2;border-top:1px solid #00aaff60;border-bottom:1px solid #00aaff60;background:rgba(0,170,255,.10);box-shadow:0 0 10px #00aaff30}
.drum-mask{position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(to bottom,rgba(10,21,37,.95) 0%,rgba(10,21,37,.5) 20%,transparent 38%,transparent 62%,rgba(10,21,37,.5) 80%,rgba(10,21,37,.95) 100%)}
label{font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;font-family:'Nunito',sans-serif}
input[type=text],input[type=number],input[type=email],input[type=password],select{width:100%;padding:9px 12px;font-size:13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:'Noto Sans JP',sans-serif;outline:none;transition:border .15s}
input:focus,select:focus{border-color:#0099ff;box-shadow:0 0 0 3px rgba(0,153,255,.15)}
.form-group{margin-bottom:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.break-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn{padding:9px 18px;font-size:13px;font-weight:700;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);color:var(--text2);font-family:'Noto Sans JP',sans-serif;transition:all .15s}
.btn:hover{background:var(--surface2);border-color:#0099ff50}
.btn-primary{background:#00aaff18;color:#ffffff;border-color:#00aaff60;box-shadow:0 0 10px #00aaff30;text-shadow:0 0 8px #00aaff}
.btn-primary:hover{background:#00aaff30;border-color:#00aaff;box-shadow:0 0 16px #00aaff50}
.btn-danger{color:#ff4466}.btn-danger:hover{background:#1a0010;border-color:#ff4466}
.btn-sm{padding:6px 14px;font-size:12px}.btn-xs{padding:3px 9px;font-size:11px}
.flex-end{display:flex;justify-content:flex-end;gap:8px}
.flex-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shift-list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0a1e35;border-radius:var(--radius-sm);margin-bottom:6px;font-size:13px;border:1px solid #00aaff35;box-shadow:0 0 8px #00aaff15}
.sli-input{padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-family:'Rajdhani',sans-serif;font-weight:600;text-align:center}
.shift-list-time{font-family:'Quantico',sans-serif;font-weight:400;flex:1;color:#aaddff}
.shift-list-amt{font-family:'Quantico',sans-serif;color:#ffffff;font-weight:700;text-shadow:0 0 8px #00aaff,0 0 16px #00aaff}
.divider{border:none;border-top:1.5px solid var(--border);margin:14px 0}
.wage-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-left:2px solid #0099ff;border-radius:var(--radius-sm);margin-bottom:8px;font-size:13px}
.wage-period{flex:1;color:var(--text2);font-size:12px}
.wage-rate{font-family:'Quantico',sans-serif;font-weight:700;color:#66ccff}
.separator{border:none;border-top:1.5px solid var(--border);margin:18px 0}
.cfg-row{padding:10px 0}
.cfg-label{font-size:11px;font-weight:700;color:#0099ff80;margin-bottom:7px;font-family:'Orbitron',sans-serif;letter-spacing:.5px}
.cfg-divider{border:none;border-top:1px solid var(--border);margin:0}
.section-label{font-size:12px;font-weight:700;color:#ffffff;margin-bottom:10px;font-family:'Orbitron',sans-serif;letter-spacing:1px;text-shadow:0 0 10px #00aaff}
.empty-state{text-align:center;padding:24px;color:var(--text3);font-size:13px}
[data-cyber] .card,[data-cyber] .modal{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    
    <div class="login-title">扶養内収入管理</div>
    <div class="login-sub">ログインしてください</div>
    <label class="login-label">メールアドレス</label>
    <input class="login-input" type="email" id="loginEmail" placeholder="example@email.com" autocomplete="email">
    <label class="login-label">パスワード</label>
    <input class="login-input" type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- アプリ本体 -->
<div id="appScreen" style="display:none">
  <div class="header">
    <div class="header-left">
      <div class="header-title">
        
        扶養内収入管理
      </div>
    </div>
    <div class="header-right">
      <span class="year-badge" id="yearBadge">2026年</span>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('dash')">ダッシュボード</button>
      <button class="tab" onclick="showTab('cal')">カレンダー</button>
      <button class="tab" onclick="showTab('wage')">時給設定</button>
      <button class="tab" onclick="showTab('cfg')">設定</button>
    </div>

    <div id="tab-dash" style="margin-top:16px">
      <div id="alertArea"></div>
      <div class="metric-grid">
        <div class="metric"><div class="metric-label">年間収入</div><div class="metric-value" id="m-total">¥0円</div></div>
        <div class="metric"><div class="metric-label">残り枠</div><div class="metric-value ok" id="m-remain">¥0円</div></div>
        <div class="metric"><div class="metric-label">残り月平均</div><div class="metric-value" id="m-avg">¥0円</div></div>
        <div class="metric"><div class="metric-label">今月の収入</div><div class="metric-value" id="m-cur">¥0円</div></div>
      </div>
      <div class="card">
        <div class="progress-header">
          <span style="font-size:13px;font-weight:700;color:var(--text2);font-family:'Nunito',sans-serif">年間進捗</span>
          <span class="progress-pct" id="pct-label">0%</span>
        </div>
        <div class="pbar"><div class="pfill ok" id="pfill" style="width:0%"></div></div>
        <div class="progress-footer"><span>¥0</span><span id="limit-label">上限 ¥1,230,000</span></div>
      </div>
      <div class="month-list-label">月別収入</div><div class="month-list" id="monthRow"></div>

    </div>

    <div id="tab-cal" style="display:none;margin-top:16px">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calPrev()">&#8249;</button>
        <span class="cal-nav-title" id="calTitle">2026年1月</span>
        <button class="cal-nav-btn" onclick="calNext()">&#8250;</button>
      </div>
      <div style="margin-bottom:10px">
        <button class="btn btn-primary" style="width:100%;font-size:13px" onclick="openScanModal()">📊 Excelからシフトを読み込む</button>
      </div>
      <div class="card" style="padding:12px">
        <div class="cal-grid">
          <div class="cal-dow">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div>
          <div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow">土</div>
        </div>
        <div class="cal-grid" id="calBody" style="margin-top:3px"></div>
      </div>
      <div class="cal-summary" id="calSummary"></div>
    </div>

    <div id="tab-wage" style="display:none;margin-top:16px">
      <div class="card">
        <div class="card-title">時給を追加</div>
        <div class="row2" style="margin-bottom:10px">
          <div><label>開始日</label><input type="date" id="w-start" style="width:100%;min-width:0;font-size:12px;padding:7px 4px 7px 0px"></div>
          <div><label>終了日（空白=無期限）</label><input type="date" id="w-end" style="width:100%;min-width:0;font-size:12px;padding:7px 4px 7px 0px"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:flex-end">
          <div><label>時給（円）</label><input type="number" id="w-rate" placeholder="1120" min="0" style="width:100%;min-width:0"></div>
          <button class="btn btn-primary" onclick="addWage()" style="white-space:nowrap;margin-bottom:0;align-self:flex-end">＋ 追加</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">設定済み時給</div>
        <div id="wageList"></div>
      </div>
    </div>

    <div id="tab-cfg" style="display:none;margin-top:16px">
      <div class="card" style="padding:14px 16px">
        <div class="cfg-row">
          <div class="cfg-label">年収上限</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <button class="btn btn-sm" id="preset-123" onclick="setLimit(1230000)">123万円</button>
            <input type="number" id="customLimit" placeholder="カスタム（円）" style="width:130px;padding:6px 10px;font-size:12px">
            <button class="btn btn-primary btn-sm" onclick="setCustomLimit()">設定</button>
          </div>
          <div style="font-size:12px;color:var(--text2);margin-top:5px">現在：<span id="limitDisp" style="font-weight:700;color:var(--text);font-family:'Rajdhani',sans-serif">¥1,230,000</span></div>
        </div>
        <div class="cfg-divider"></div>
        <div class="cfg-row">
          <div class="cfg-label">対象年</div>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" id="cfgYear" value="2026" min="2020" max="2040" style="width:90px;padding:6px 10px;font-size:12px">
            <button class="btn btn-sm" onclick="setYear()">適用</button>
          </div>
        </div>
        <div class="cfg-divider"></div>
        <div class="cfg-row">
          <div class="cfg-label" style="color:var(--danger)">データ管理</div>
          <button class="btn btn-danger btn-sm" onclick="clearAll()">全データを削除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- シフトExcel読み込みモーダル -->
<div class="overlay" id="scanOverlay" onclick="scanOverlayClick(event)">
  <div class="scan-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;color:var(--text);font-family:'Nunito',sans-serif">Excelからシフトを読み込む</div>
      <button onclick="closeScanModal()" style="background:none;border:none;font-size:20px;color:var(--text2);cursor:pointer;line-height:1">×</button>
    </div>
    <div class="upload-area" onclick="document.getElementById('scanFileInput').click()">
      <input type="file" id="scanFileInput" accept=".xlsx,.xls" onchange="onExcelSelected(event)">
      <div class="upload-icon" style="font-size:32px;margin-bottom:8px">📊</div>
      <div class="upload-text">タップしてExcelを選択</div>
      <div class="upload-sub">シフト表の .xlsx ファイルをアップロード</div>
    </div>
    <div class="scan-status" id="scanStatus"></div>
    <div class="scan-result" id="scanResult" style="display:none">
      <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:8px;font-family:'Nunito',sans-serif">読み取り結果（修正できます）</div>
      <table class="scan-table">
        <thead><tr><th>日付</th><th>開始</th><th>終了</th><th>休憩</th><th></th></tr></thead>
        <tbody id="scanTableBody"></tbody>
      </table>
    </div>
    <div class="scan-btn-row" id="scanBtnRow" style="display:none">
      <button class="btn" style="flex:1;font-size:12px" onclick="closeScanModal()">キャンセル</button>
      <button class="btn btn-primary" style="flex:2;font-size:12px" onclick="applyScanResults()">カレンダーに反映する</button>
    </div>
  </div>
</div>

<!-- シフト入力モーダル -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">シフト入力</div>
    <div id="modalExisting"></div>
    <hr class="divider">
    <div style="font-size:12px;font-weight:800;color:var(--text2);margin-bottom:12px;font-family:'Nunito',sans-serif">新しいシフトを追加</div>
    <div class="pickers-row" style="margin-bottom:14px;justify-content:center">
      <div class="picker-group">
        <div class="picker-group-label">開始</div>
        <div class="picker-pair">
          <div class="drum-col" id="p-sh"><div class="drum-selector"></div><div class="drum-list" id="pl-sh"></div><div class="drum-mask"></div></div>
          <span class="picker-colon">:</span>
          <div class="drum-col" id="p-sm"><div class="drum-selector"></div><div class="drum-list" id="pl-sm"></div><div class="drum-mask"></div></div>
        </div>
      </div>
      <div style="align-self:center;font-size:22px;color:var(--text3);font-weight:700;padding-top:18px">〜</div>
      <div class="picker-group">
        <div class="picker-group-label">終了</div>
        <div class="picker-pair">
          <div class="drum-col" id="p-eh"><div class="drum-selector"></div><div class="drum-list" id="pl-eh"></div><div class="drum-mask"></div></div>
          <span class="picker-colon">:</span>
          <div class="drum-col" id="p-em"><div class="drum-selector"></div><div class="drum-list" id="pl-em"></div><div class="drum-mask"></div></div>
        </div>
      </div>
    </div>
    <div class="break-row">
      <div><label>休憩（分）</label><input type="number" id="m-break" value="0" min="0"></div>
      <div><label>メモ（任意）</label><input type="text" id="m-memo" placeholder=""></div>
    </div>
    <div class="flex-end">
      <button class="btn btn-sm" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary btn-sm" onclick="saveShift()">追加</button>
    </div>
  </div>
</div>

</body>
</html>
