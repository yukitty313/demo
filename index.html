<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>迷路ゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d14;
    color: #e8e8f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }
  h1 { font-size: 11px; letter-spacing: 0.3em; color: #5a5a8a; text-transform: uppercase; margin-bottom: 16px; }
  #hud { display: flex; justify-content: space-between; width: 340px; margin-bottom: 10px; font-size: 12px; letter-spacing: 0.1em; color: #5a5a8a; }
  #hud .val { color: #a0a0d0; font-weight: bold; }
  #lvBadge { background: #1a1a2e; border: 1px solid #2a2a4a; padding: 3px 12px; border-radius: 4px; font-size: 11px; letter-spacing: 0.2em; color: #6060a0; }
  canvas { display: block; border: 1px solid #2a2a4a; border-radius: 4px; }
  #msg { margin-top: 12px; font-size: 12px; letter-spacing: 0.05em; color: #5a5a8a; min-height: 18px; text-align: center; }
  #msg.clear { color: #3a9a7a; }
  button { margin-top: 14px; padding: 10px 36px; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; background: transparent; color: #7070b0; border: 1px solid #2a2a4a; border-radius: 4px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
  button:hover { border-color: #5050a0; color: #a0a0d0; }
  #pcHint { margin-top: 10px; font-size: 10px; letter-spacing: 0.1em; color: #3a3a5a; }
</style>
</head>
<body>

<h1>Maze Tilt</h1>
<div id="hud">
  <div>TIME <span class="val" id="timerDisp">0.0</span>s</div>
  <div id="lvBadge">LV <span id="lvDisp">1</span></div>
  <div>BEST <span class="val" id="bestDisp">—</span>s</div>
</div>
<canvas id="c" width="340" height="340"></canvas>
<div id="msg">STARTを押して端末を傾けてください</div>
<button id="startBtn">START</button>
<div id="pcHint">PC: 矢印キーで操作</div>

<script>
const CV = document.getElementById('c');
const ctx = CV.getContext('2d');
const W = 340, H = 340, CELL = 20;

let ball, vx, vy, walls, goal, running = false, startTime, animId;
let level = 1, best = {};
let tiltX = 0, tiltY = 0;
let permGranted = false;

const MAZES = [
  [
    "#################",
    "#S  #    #      #",
    "# # # ## # #### #",
    "# # #  # #    # #",
    "# ### ## ##### ##",
    "#   #  #   #    #",
    "### # ## # # ## #",
    "#   #    # #    #",
    "# ####### # ### #",
    "#   #   # #     #",
    "### # # # ##### #",
    "#   # # #     # #",
    "# ### ####### # #",
    "#     #     # # #",
    "##### # ### # # #",
    "#       #     #G#",
    "#################",
  ],
  [
    "#################",
    "#S# #       #   #",
    "# # # ##### # # #",
    "#   #   #   # # #",
    "####### # ### # #",
    "#   #   #   # # #",
    "# # # ##### # # #",
    "# # #   #   # # #",
    "# # ### # ### # #",
    "# #   # #   # # #",
    "# ### # ### # # #",
    "#   # #   # # # #",
    "### # ### # # # #",
    "#   #   # # #   #",
    "# ##### # # ### #",
    "#       #     #G#",
    "#################",
  ],
  [
    "#################",
    "#S    #   #     #",
    "##### # # # ### #",
    "#     # # # #   #",
    "# ##### # # # ###",
    "#   #   # #   # #",
    "### # ### ##### #",
    "#   #   #   #   #",
    "# ##### # # # ###",
    "# #   # # # #   #",
    "# # # # # # ### #",
    "# # # # # #   # #",
    "# # # # # ### # #",
    "# # # #   #   # #",
    "# # # ##### ### #",
    "#   #         #G#",
    "#################",
  ]
];

function parseMaze(maze) {
  const w = [], s = {x: CELL + CELL/2, y: CELL + CELL/2}, g = {x: W - CELL/2, y: H - CELL/2};
  for (let r = 0; r < maze.length; r++) {
    for (let c = 0; c < maze[r].length; c++) {
      const ch = maze[r][c];
      if (ch === '#') w.push({ x: c * CELL, y: r * CELL });
      if (ch === 'S') { s.x = c * CELL + CELL / 2; s.y = r * CELL + CELL / 2; }
      if (ch === 'G') { g.x = c * CELL + CELL / 2; g.y = r * CELL + CELL / 2; }
    }
  }
  return { w, s, g };
}

function drawFrame() {
  ctx.fillStyle = '#0d0d14';
  ctx.fillRect(0, 0, W, H);

  if (!walls || !ball || !goal) return;

  walls.forEach(w => {
    ctx.fillStyle = '#1e1e30';
    ctx.fillRect(w.x, w.y, CELL, CELL);
    ctx.strokeStyle = '#2a2a45';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(w.x + 0.5, w.y + 0.5, CELL - 1, CELL - 1);
  });

  ctx.fillStyle = '#1a5a45';
  ctx.beginPath();
  ctx.arc(goal.x, goal.y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3a9a7a';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#3a9a7a';
  ctx.font = 'bold 7px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('GOAL', goal.x, goal.y);

  ctx.fillStyle = '#3060b0';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#5090e0';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function collides(nx, ny, r) {
  for (const w of walls) {
    const cx = Math.max(w.x, Math.min(nx, w.x + CELL));
    const cy = Math.max(w.y, Math.min(ny, w.y + CELL));
    const dx = nx - cx, dy = ny - cy;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;
}

function loop() {
  if (!running) return;
  const GRAVITY = 0.18, FRICTION = 0.88, R = 7;

  vx = (vx + tiltX * GRAVITY) * FRICTION;
  vy = (vy + tiltY * GRAVITY) * FRICTION;

  let nx = ball.x + vx;
  let ny = ball.y + vy;

  if (collides(nx, ball.y, R)) { vx *= -0.3; nx = ball.x; }
  if (collides(ball.x, ny, R)) { vy *= -0.3; ny = ball.y; }

  nx = Math.max(R, Math.min(W - R, nx));
  ny = Math.max(R, Math.min(H - R, ny));

  ball.x = nx;
  ball.y = ny;

  const dx = ball.x - goal.x, dy = ball.y - goal.y;
  if (dx * dx + dy * dy < 14 * 14) {
    running = false;
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    if (!best[level] || parseFloat(elapsed) < parseFloat(best[level])) best[level] = elapsed;
    document.getElementById('bestDisp').textContent = best[level];
    const msg = document.getElementById('msg');
    msg.textContent = 'クリア！ ' + elapsed + '秒 → 次のレベルへ';
    msg.className = 'clear';
    const btn = document.getElementById('startBtn');
    btn.textContent = 'NEXT LV';
    btn.onclick = function() { level++; document.getElementById('lvDisp').textContent = level; startGame(); };
    drawFrame();
    return;
  }

  document.getElementById('timerDisp').textContent = ((Date.now() - startTime) / 1000).toFixed(1);
  drawFrame();
  animId = requestAnimationFrame(loop);
}

async function startGame() {
  if (animId) cancelAnimationFrame(animId);
  running = false;

  const maze = MAZES[(level - 1) % MAZES.length];
  const parsed = parseMaze(maze);
  walls = parsed.w;
  ball = { x: parsed.s.x, y: parsed.s.y };
  goal = { x: parsed.g.x, y: parsed.g.y };
  vx = 0; vy = 0;

  const msg = document.getElementById('msg');
  msg.textContent = '端末を傾けてボールを転がしてください';
  msg.className = '';
  const btn = document.getElementById('startBtn');
  btn.textContent = 'RESTART';
  btn.onclick = startGame;
  document.getElementById('lvDisp').textContent = level;
  document.getElementById('timerDisp').textContent = '0.0';

  if (!permGranted) {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === 'granted') permGranted = true;
      } catch(e) {}
    } else {
      permGranted = true;
    }
  }

  running = true;
  startTime = Date.now();
  drawFrame();
  animId = requestAnimationFrame(loop);
}

window.addEventListener('deviceorientation', function(e) {
  if (!running) return;
  tiltX = Math.max(-1, Math.min(1, (e.gamma || 0) / 30));
  tiltY = Math.max(-1, Math.min(1, ((e.beta || 45) - 45) / 30));
});

document.addEventListener('keydown', function(e) {
  if (!running) return;
  var s = 0.7;
  if (e.key === 'ArrowLeft')  { tiltX = -s; e.preventDefault(); }
  if (e.key === 'ArrowRight') { tiltX =  s; e.preventDefault(); }
  if (e.key === 'ArrowUp')    { tiltY = -s; e.preventDefault(); }
  if (e.key === 'ArrowDown')  { tiltY =  s; e.preventDefault(); }
});
document.addEventListener('keyup', function(e) {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key) >= 0) {
    tiltX = 0; tiltY = 0;
  }
});

document.getElementById('startBtn').onclick = startGame;

var initParsed = parseMaze(MAZES[0]);
walls = initParsed.w;
ball = { x: initParsed.s.x, y: initParsed.s.y };
goal = { x: initParsed.g.x, y: initParsed.g.y };
drawFrame();
</script>
</body>
</html>
